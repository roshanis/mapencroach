# Dev runtime for mapencroach. Start: docker compose up -d
# Production runs on state DC / MeitY-empanelled cloud — this file is for local dev only.
#
# Scope: these are the backing services the platform is being built toward.
# The API does not talk to them yet — it runs in-memory (see backend/README.md),
# and db/models.py defines the schema without an engine bound to it. Bring this
# stack up when working on persistence, object storage, or tiling; the demo and
# test suites need none of it.
#
# Ports bind to 127.0.0.1 so a laptop on an untrusted network does not expose
# these default-credentialled services to the LAN.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mapencroach
      POSTGRES_USER: mapencroach
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devonly-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapencroach"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    # Floats at the patch level; quay.io was unreachable from the build
    # environment, so a specific patch tag could not be verified.
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-devonly-change-me}
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo done"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    # Pinned by digest: MinIO publishes only RELEASE.* tags plus a floating
    # `latest`, so a digest is the only stable way to reproduce this stack.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mapencroach
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-devonly-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  titiler:
    image: ghcr.io/developmentseed/titiler:2.2.1
    environment:
      AWS_ACCESS_KEY_ID: mapencroach
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-devonly-change-me}
      AWS_S3_ENDPOINT: minio:9000
      AWS_HTTPS: "FALSE"
      AWS_VIRTUAL_HOSTING: "FALSE"
    ports:
      - "127.0.0.1:8082:8000"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
